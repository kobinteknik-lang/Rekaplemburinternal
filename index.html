<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Rekap Lembur</title>
<!-- Import Font Inter Modern -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-glow: rgba(79, 70, 229, 0.25);
    --text-main: #1e293b;
    --text-muted: #64748b;
    --danger: #ef4444;
    --glass-bg: rgba(255, 255, 255, 0.75);
    --glass-border: rgba(255, 255, 255, 0.6);
    --shadow-soft: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
    --radius-lg: 20px;
    --radius-md: 12px;
  }
  
  * { box-sizing: border-box; }
  
  /* Latar Belakang Aesthetic (Mesh Gradient) */
  body { 
    margin: 0; 
    font-family: 'Inter', sans-serif; 
    color: var(--text-main); 
    line-height: 1.5; 
    background-color: #f1f5f9;
    background-image: 
      radial-gradient(at 0% 0%, hsla(253, 90%, 90%, 0.8) 0px, transparent 50%),
      radial-gradient(at 100% 0%, hsla(213, 90%, 90%, 0.8) 0px, transparent 50%),
      radial-gradient(at 100% 100%, hsla(300, 90%, 94%, 0.8) 0px, transparent 50%),
      radial-gradient(at 0% 100%, hsla(220, 90%, 90%, 0.8) 0px, transparent 50%);
    background-attachment: fixed;
    background-size: cover;
  }
  
  /* Header Elegan */
  header { 
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
    color: white; 
    padding: 40px 20px 70px; 
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .header-inner, .container { max-width: 1100px; margin: auto; }
  h1 { margin: 0 0 10px 0; font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -0.03em; }
  header p { margin: 0; color: #cbd5e1; font-size: 15px; font-weight: 400; }
  
  /* Glassmorphism Panel */
  .container { padding: 0 20px 40px; margin-top: -40px; position: relative; z-index: 2; }
  .panel { 
    background: var(--glass-bg); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border); 
    border-radius: var(--radius-lg); 
    box-shadow: var(--shadow-soft); 
    padding: 28px; 
    margin-bottom: 28px; 
  }
  .panel-head { 
    display: flex; align-items: center; justify-content: space-between; 
    gap: 16px; margin-bottom: 24px; padding-bottom: 16px; 
    border-bottom: 1px solid rgba(226, 232, 240, 0.6); 
    flex-wrap: wrap;
  }
  h2 { font-size: 19px; margin: 0; color: #0f172a; font-weight: 700; letter-spacing: -0.01em;}
  
  /* Grid Auto-sizing */
  .form-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
    gap: 20px; 
  }
  .dashboard-filters { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
    gap: 16px; margin-bottom: 24px; 
    background: rgba(255, 255, 255, 0.4); 
    padding: 16px; border-radius: var(--radius-md); 
    border: 1px solid rgba(255, 255, 255, 0.8); 
  }
  .stats { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
    gap: 16px; margin-bottom: 24px; 
  }
  
  /* Estetik Fields & Inputs */
  .field { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 13px; font-weight: 600; color: #334155; }
  input, select { 
    width: 100%; border: 1px solid #cbd5e1; border-radius: var(--radius-md); 
    padding: 12px 16px; font: inherit; font-size: 14px; 
    background: rgba(255, 255, 255, 0.9); 
    color: var(--text-main); outline: none; transition: all 0.3s ease; 
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
  input:focus, select:focus { 
    border-color: var(--primary); 
    background: #ffffff;
    box-shadow: 0 0 0 4px var(--primary-glow); 
  }
  input[readonly] { background: rgba(241, 245, 249, 0.6); color: var(--text-muted); border-color: transparent; }
  
  /* Estetik Buttons */
  .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  button { 
    border: 0; border-radius: var(--radius-md); padding: 12px 20px; font: inherit; 
    font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
    display: inline-flex; align-items: center; justify-content: center;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
  
  .primary { 
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
    color: white; 
    box-shadow: 0 4px 14px var(--primary-glow);
  }
  .primary:hover { 
    box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); 
    transform: translateY(-2px);
  }
  .secondary { background: rgba(255, 255, 255, 0.8); color: var(--text-main); border: 1px solid #cbd5e1; }
  .secondary:hover { background: #ffffff; border-color: #94a3b8; transform: translateY(-2px); }
  
  .outline.small { background: transparent; border: 1px solid #cbd5e1; padding: 6px 12px; font-size: 12px; border-radius: 8px;}
  .outline.small:hover { background: rgba(255,255,255,0.5); }
  
  .danger.small { background: #fee2e2; color: var(--danger); padding: 6px 12px; font-size: 12px; border-radius: 8px;}
  .danger.small:hover { background: #fca5a5; color: #7f1d1d;}
  
  /* Kartu Statistik Mewah */
  .stat { 
    background: rgba(255, 255, 255, 0.6); 
    border: 1px solid rgba(255, 255, 255, 0.9); 
    border-radius: 16px; 
    padding: 24px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .stat:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.06); background: rgba(255, 255, 255, 0.9); }
  .stat .label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
  .stat strong { display: block; font-size: 32px; margin-top: 8px; color: #0f172a; line-height: 1.1; font-weight: 700;}
  
  /* Desain Tabel Bersih */
  .table-wrap { 
    overflow-x: auto; border: 1px solid rgba(226, 232, 240, 0.7); 
    border-radius: var(--radius-md); max-height: 500px; overflow-y: auto;
    background: rgba(255, 255, 255, 0.5);
  }
  table { border-collapse: collapse; width: 100%; min-width: 800px; text-align: left; }
  th, td { padding: 16px; border-bottom: 1px solid rgba(226, 232, 240, 0.7); font-size: 14px; }
  th { 
    background: rgba(248, 250, 252, 0.9); backdrop-filter: blur(8px);
    color: var(--text-muted); font-size: 12px; text-transform: uppercase; 
    letter-spacing: 0.5px; font-weight: 600; position: sticky; top: 0; z-index: 1; 
  }
  tbody tr { transition: background-color 0.2s ease; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.8); }
  tbody tr:last-child td { border-bottom: 0; }
  
  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 14px; }
  
  /* Toast Animasi Halus */
  .toast { 
    position: fixed; right: 24px; bottom: 24px; background: #0f172a; color: white; 
    padding: 16px 24px; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
    display: none; z-index: 50; font-size: 14px; font-weight: 500; 
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast.error { background: var(--danger); }
  
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  @media(max-width: 640px) {
    header { padding: 30px 16px 60px; }
    .container { padding: 0 16px 30px; }
    .panel { padding: 20px; }
    .stat strong { font-size: 26px; }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Rekapitulasi Lembur</h1>
    <p>Sistem pencatatan lembur karyawan terintegrasi Google Sheets</p>
  </div>
</header>

<main class="container">

  <!-- PANEL FORM INPUT -->
  <section class="panel">
    <div class="panel-head">
      <h2>Form Input Lembur</h2>
    </div>
    <form id="overtimeForm">
      <div class="form-grid">
        <div class="field">
          <label for="date">Tanggal *</label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label for="nik">Pilih NIK *</label>
          <input id="nik" list="employeeOptions" placeholder="Ketik NIK..." autocomplete="off" required>
          <datalist id="employeeOptions"></datalist>
        </div>
        <div class="field">
          <label for="name">Nama Karyawan</label>
          <input id="name" placeholder="Otomatis terisi..." readonly required>
        </div>
        <div class="field">
          <label for="description">Pekerjaan *</label>
          <input id="description" placeholder="Deskripsi pekerjaan..." required>
        </div>
        <div class="field">
          <label for="hours">Durasi (Jam) *</label>
          <input type="number" id="hours" step="0.5" min="0.5" placeholder="Contoh: 2 atau 2.5" required>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">Simpan Data</button>
        <button class="secondary" type="button" id="resetBtn">Reset Form</button>
      </div>
    </form>
  </section>

  <!-- PANEL DASHBOARD & REKAP -->
  <section class="panel">
    <div class="panel-head">
      <h2>Dashboard & Data Lembur</h2>
      <button class="outline small" type="button" id="refreshBtn">
        <svg style="width:14px;height:14px;margin-right:6px;vertical-align:middle;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Muat Ulang
      </button>
    </div>

    <!-- FILTER DASHBOARD -->
    <div class="dashboard-filters">
      <div class="field">
        <label for="dashYear">Filter Tahun</label>
        <select id="dashYear"><option value="">Semua Tahun</option></select>
      </div>
      <div class="field">
        <label for="dashMonth">Filter Bulan</label>
        <select id="dashMonth">
          <option value="">Semua Bulan</option>
          <option value="01">Januari</option><option value="02">Februari</option>
          <option value="03">Maret</option><option value="04">April</option>
          <option value="05">Mei</option><option value="06">Juni</option>
          <option value="07">Juli</option><option value="08">Agustus</option>
          <option value="09">September</option><option value="10">Oktober</option>
          <option value="11">November</option><option value="12">Desember</option>
        </select>
      </div>
      <div class="field">
        <label for="dashName">Filter Karyawan</label>
        <select id="dashName"><option value="">Semua Karyawan</option></select>
      </div>
    </div>

    <!-- CARDS DASHBOARD -->
    <section class="stats">
      <div class="stat">
        <div class="label">Total Pengajuan</div>
        <strong id="statCount">0</strong>
      </div>
      <div class="stat">
        <div class="label">Total Jam Lembur</div>
        <strong id="statHours">0 <span style="font-size:16px;color:#64748b;">Jam</span></strong>
      </div>
      <div class="stat">
        <div class="label">Jumlah Karyawan</div>
        <strong id="statPeople">0 <span style="font-size:16px;color:#64748b;">Orang</span></strong>
      </div>
    </section>

    <!-- TABEL REKAP DATA -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>NIK</th>
            <th>Nama Karyawan</th>
            <th>Pekerjaan</th>
            <th>Durasi</th>
            <th style="width: 80px; text-align: center;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty">Memuat data dari Google Sheets...</div>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status"></div>

<script>
// URL WEB APP GOOGLE APPS SCRIPT
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxUS8HZlmevSUyl_Ul5vfUqdx99-B46ATFintRb0UxhGQqGVWdFaFABgffoA-M3jCGY/exec';

let records = [];
let employees = [];

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, error = false){
  const e = $('toast');
  e.textContent = msg;
  e.className = 'toast' + (error ? ' error' : '');
  e.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.style.display = 'none', 3500);
}

// FUNGSI CALLER BACKEND
function runBackend(action, payload = {}) {
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[action](payload);
    } else {
      const url = `${SCRIPT_URL}?action=${encodeURIComponent(action)}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
      
      fetch(url)
        .then(res => res.json())
        .then(res => {
          if (res && res.success === false) reject(res);
          else resolve(res);
        })
        .catch(err => {
          console.error("Fetch Error:", err);
          reject(new Error("Gagal terhubung ke Google Sheets. Pastikan Web App disetel ke 'Anyone'."));
        });
    }
  });
}

function fillEmployeeName(){
  const inputNik = $('nik').value.trim();
  const emp = employees.find(e => String(e.nik).trim() === inputNik);
  $('name').value = emp ? emp.name : '';
}

function loadEmployees(){
  runBackend('listEmployees')
    .then(data => {
      employees = Array.isArray(data) ? data : [];
      $('employeeOptions').innerHTML = employees.map(e => 
        `<option value="${esc(e.nik)}">${esc(e.name)}</option>`
      ).join('');
      
      $('dashName').innerHTML = '<option value="">Semua Karyawan</option>' + 
        employees.map(e => `<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');
    })
    .catch(() => toast('Gagal memuat database karyawan.', true));
}

function getFilteredRecords(){
  const year = $('dashYear').value;
  const month = $('dashMonth').value;
  const name = $('dashName').value.toLowerCase();

  return records.filter(r => {
    if (!r.date) return false;
    const [rYear, rMonth] = r.date.split('-');
    
    const matchYear = !year || rYear === year;
    const matchMonth = !month || rMonth === month;
    const matchName = !name || (r.name && r.name.toLowerCase() === name);

    return matchYear && matchMonth && matchName;
  });
}

function render(){
  const rows = getFilteredRecords();

  $('tableBody').innerHTML = rows.map(r => `
    <tr>
      <td>${esc(r.date)}</td>
      <td><span style="font-family: monospace; color: #64748b; background: rgba(241,245,249,0.7); padding: 4px 6px; border-radius: 4px;">${esc(r.nik)}</span></td>
      <td><strong style="color: #334155;">${esc(r.name)}</strong></td>
      <td>${esc(r.description)}</td>
      <td><strong style="color: #4f46e5;">${Number(r.hours || 0)} Jam</strong></td>
      <td style="text-align: center;">
        <button class="danger small" onclick="deleteRecord('${esc(r.id)}')">Hapus</button>
      </td>
    </tr>
  `).join('');

  $('emptyState').style.display = rows.length ? 'none' : 'block';
  $('emptyState').textContent = records.length ? 'Tidak ada data sesuai filter.' : 'Belum ada data lembur.';

  const totalHours = rows.reduce((acc, r) => acc + (Number(r.hours) || 0), 0);
  const uniquePeople = new Set(rows.map(r => r.nik || r.name)).size;

  $('statCount').textContent = rows.length;
  $('statHours').innerHTML = `${totalHours} <span style="font-size:16px;color:#64748b;">Jam</span>`;
  $('statPeople').innerHTML = `${uniquePeople} <span style="font-size:16px;color:#64748b;">Orang</span>`;
}

function loadData(showMessage = false){
  $('emptyState').style.display = 'block';
  $('emptyState').textContent = 'Memuat data dari Google Sheets...';$('tableBody').innerHTML = '';

  runBackend('listRecords')
    .then(data => {
      records = Array.isArray(data) ? data : [];
      
      const years = [...new Set(records.map(r => r.date ? r.date.split('-')[0] : null).filter(Boolean))].sort().reverse();
      const currentYear = $('dashYear').value;
      $('dashYear').innerHTML = '<option value="">Semua Tahun</option>' + 
        years.map(y => `<option value="${y}">${y}</option>`).join('');
      if (years.includes(currentYear)) $('dashYear').value = currentYear;

      render();
      if (showMessage) toast('Data berhasil diperbarui.');
    })
    .catch(err => {
      $('emptyState').textContent = 'Gagal memuat data.';
      toast(err && err.message ? err.message : 'Gagal memuat data.', true);
    });
}

$('nik').addEventListener('input', fillEmployeeName);$('nik').addEventListener('change', fillEmployeeName);

$('overtimeForm').addEventListener('submit', e => {
  e.preventDefault();
  fillEmployeeName();

  const payload = {
    date: $('date').value,
    nik: $('nik').value.trim(),
    name: $('name').value.trim(),
    description: $('description').value.trim(),
    hours: $('hours').value
  };

  if (!payload.name) {
    toast('NIK tidak ditemukan di Database Karyawan!', true);
    return;
  }

  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'Menyimpan...';

  runBackend('saveRecord', payload)
    .then(res => {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'Simpan Data';
      toast(res.message || 'Data lembur berhasil disimpan!');
      
      $('overtimeForm').reset();
      $('name').value = '';$('date').value = new Date().toISOString().split('T')[0];

      loadData();
    })
    .catch(err => {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'Simpan Data';
      toast(err && err.message ? err.message : 'Gagal menyimpan data.', true);
    });
});

window.deleteRecord = id => {
  if (!confirm('Yakin ingin menghapus baris data lembur ini?')) return;
  runBackend('deleteRecord', id)
    .then(res => {
      toast(res.message || 'Data dihapus.');
      loadData();
    })
    .catch(err => toast(err && err.message ? err.message : 'Gagal menghapus data.', true));
};

$('resetBtn').addEventListener('click', () => {$('overtimeForm').reset();
  $('name').value = '';$('date').value = new Date().toISOString().split('T')[0];
});

$('refreshBtn').addEventListener('click', () => loadData(true));
['dashYear', 'dashMonth', 'dashName'].forEach(id => $(id).addEventListener('change', render));

$('date').value = new Date().toISOString().split('T')[0];
loadEmployees();
loadData();
</script>

</body>
</html>
