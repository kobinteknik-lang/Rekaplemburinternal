<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Rekap Lembur</title>
<style>
:root{--navy:#15324b;--blue:#2563eb;--bg:#f4f7fb;--line:#e2e8f0;--muted:#64748b;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033}
header{background:linear-gradient(125deg,#15324b,#245b83);color:white;padding:24px 20px 50px}.header-inner,.container{max-width:1180px;margin:auto}
h1{margin:4px 0;font-size:clamp(22px,3.5vw,30px)}header p{margin:0;color:#dbeafe;font-size:14px}
.container{padding:0 16px 36px;margin-top:-30px}
.panel{background:white;border:1px solid #e8edf4;border-radius:14px;box-shadow:0 6px 20px #19324b0a;padding:20px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
h2{font-size:16px;margin:0;color:var(--navy)}
.form-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:12px;font-weight:650;color:#334155}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;background:#fff;color:#172033;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}
input[readonly]{background:#f8fafc;color:#64748b}
.actions{display:flex;gap:8px;margin-top:14px}
button{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#eaf0f6;color:#334155}.outline{background:white;border:1px solid #cbd5e1;color:#334155}.danger{background:#fee2e2;color:var(--red)}.small{padding:5px 8px;font-size:11px}
button:disabled{opacity:.55;cursor:wait}

/* Dashboard Styles */
.dashboard-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;text-align:center}
.stat .label{font-size:12px;color:var(--muted);font-weight:600}
.stat strong{display:block;font-size:22px;margin-top:4px;color:var(--navy)}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:700px;background:white}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #edf1f6;font-size:13px}
th{background:#f8fafc;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:#fafcff}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.toast{position:fixed;right:20px;bottom:20px;background:#15324b;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px #0002;display:none;z-index:10;font-size:13px}.toast.error{background:#991b1b}

@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-filters,.stats{grid-template-columns:1fr}}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Input & Rekap Lembur Karyawan</h1>
    <p>Pencatatan lembur terintegrasi Google Sheets</p>
  </div>
</header>

<main class="container">

  <!-- PANEL FORM INPUT -->
  <section class="panel">
    <div class="panel-head">
      <h2>Form Input Lembur</h2>
    </div>
    <form id="overtimeForm">
      <div class="form-grid">
        <div class="field">
          <label for="date">Tanggal *</label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label for="nik">Pilih NIK *</label>
          <input id="nik" list="employeeOptions" placeholder="Ketik NIK..." autocomplete="off" required>
          <datalist id="employeeOptions"></datalist>
        </div>
        <div class="field">
          <label for="name">Nama Karyawan</label>
          <input id="name" placeholder="Otomatis terisi..." readonly required>
        </div>
        <div class="field">
          <label for="description">Pekerjaan *</label>
          <input id="description" placeholder="Deskripsi pekerjaan" required>
        </div>
        <div class="field">
          <label for="hours">Durasi (Jam) *</label>
          <input type="number" id="hours" step="0.5" min="0.5" placeholder="Contoh: 2 atau 2.5" required>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">Simpan Data</button>
        <button class="secondary" type="button" id="resetBtn">Reset</button>
      </div>
    </form>
  </section>

  <!-- PANEL DASHBOARD & REKAP -->
  <section class="panel">
    <div class="panel-head">
      <h2>Dashboard & Rekap Data Lembur</h2>
      <button class="outline small" type="button" id="refreshBtn">Muat Ulang Data</button>
    </div>

    <!-- FILTER DASHBOARD -->
    <div class="dashboard-filters">
      <div class="field">
        <label for="dashYear">Filter Tahun</label>
        <select id="dashYear"><option value="">Semua Tahun</option></select>
      </div>
      <div class="field">
        <label for="dashMonth">Filter Bulan</label>
        <select id="dashMonth">
          <option value="">Semua Bulan</option>
          <option value="01">Januari</option><option value="02">Februari</option>
          <option value="03">Maret</option><option value="04">April</option>
          <option value="05">Mei</option><option value="06">Juni</option>
          <option value="07">Juli</option><option value="08">Agustus</option>
          <option value="09">September</option><option value="10">Oktober</option>
          <option value="11">November</option><option value="12">Desember</option>
        </select>
      </div>
      <div class="field">
        <label for="dashName">Filter Karyawan</label>
        <select id="dashName"><option value="">Semua Karyawan</option></select>
      </div>
    </div>

    <!-- CARDS DAHBOARD -->
    <section class="stats">
      <div class="stat">
        <div class="label">Total Pengajuan</div>
        <strong id="statCount">0</strong>
      </div>
      <div class="stat">
        <div class="label">Total Jam Lembur</div>
        <strong id="statHours">0 Jam</strong>
      </div>
      <div class="stat">
        <div class="label">Jumlah Karyawan Lembur</div>
        <strong id="statPeople">0 Orang</strong>
      </div>
    </section>

    <!-- TABEL REKAP DATA -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>NIK</th>
            <th>Nama Karyawan</th>
            <th>Pekerjaan</th>
            <th>Durasi</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty">Memuat data dari Google Sheets...</div>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status"></div>

<script>
// URL WEB APP GOOGLE APPS SCRIPT
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxUS8HZlmevSUyl_Ul5vfUqdx99-B46ATFintRb0UxhGQqGVWdFaFABgffoA-M3jCGY/exec';

let records = [];
let employees = [];

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, error = false){
  const e = $('toast');
  e.textContent = msg;
  e.className = 'toast' + (error ? ' error' : '');
  e.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.style.display = 'none', 3500);
}

// FUNGSI CALLER BACKEND (KOMPATIBEL GOOGLE.SCRIPT.RUN / HTTP FETCH)
function runBackend(action, payload = {}) {
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[action](payload);
    } else {
      const form = new FormData();
      form.append('action', action);
      form.append('payload', JSON.stringify(payload));

      fetch(SCRIPT_URL, { method: 'POST', body: form })
        .then(res => res.json())
        .then(res => res.success !== false ? resolve(res) : reject(res))
        .catch(reject);
    }
  });
}

// 1. CARI DAN PASANG NAMA OTOMATIS BERDASARKAN NIK
function fillEmployeeName(){
  const inputNik = $('nik').value.trim();
  const emp = employees.find(e => String(e.nik).trim() === inputNik);
  $('name').value = emp ? emp.name : '';
}

function loadEmployees(){
  runBackend('listEmployees')
    .then(data => {
      employees = Array.isArray(data) ? data : [];
      $('employeeOptions').innerHTML = employees.map(e => 
        `<option value="${esc(e.nik)}">${esc(e.name)}</option>`
      ).join('');
      
      $('dashName').innerHTML = '<option value="">Semua Karyawan</option>' + 
        employees.map(e => `<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');
    })
    .catch(() => toast('Gagal memuat database karyawan.', true));
}

// 2. LOGIKA FILTER DASHBOARD
function getFilteredRecords(){
  const year = $('dashYear').value;
  const month = $('dashMonth').value;
  const name = $('dashName').value.toLowerCase();

  return records.filter(r => {
    if (!r.date) return false;
    const [rYear, rMonth] = r.date.split('-');
    
    const matchYear = !year || rYear === year;
    const matchMonth = !month || rMonth === month;
    const matchName = !name || (r.name && r.name.toLowerCase() === name);

    return matchYear && matchMonth && matchName;
  });
}

// 3. RENDER TABEL DAN DASHBOARD
function render(){
  const rows = getFilteredRecords();

  $('tableBody').innerHTML = rows.map(r => `
    <tr>
      <td>${esc(r.date)}</td>
      <td>${esc(r.nik)}</td>
      <td><strong>${esc(r.name)}</strong></td>
      <td>${esc(r.description)}</td>
      <td><strong>${Number(r.hours || 0)} Jam</strong></td>
      <td>
        <button class="danger small" onclick="deleteRecord('${esc(r.id)}')">Hapus</button>
      </td>
    </tr>
  `).join('');

  $('emptyState').style.display = rows.length ? 'none' : 'block';
  $('emptyState').textContent = records.length ? 'Tidak ada data sesuai filter.' : 'Belum ada data lembur.';

  const totalHours = rows.reduce((acc, r) => acc + (Number(r.hours) || 0), 0);
  const uniquePeople = new Set(rows.map(r => r.nik || r.name)).size;

  $('statCount').textContent = rows.length;
  $('statHours').textContent = `${totalHours} Jam`;
  $('statPeople').textContent = `${uniquePeople} Orang`;
}

// 4. AMBIL DATA HISTORI DARI GOOGLE SHEETS
function loadData(showMessage = false){
  $('emptyState').style.display = 'block';$('emptyState').textContent = 'Memuat data dari Google Sheets...';

  runBackend('listRecords')
    .then(data => {
      records = Array.isArray(data) ? data : [];
      
      const years = [...new Set(records.map(r => r.date ? r.date.split('-')[0] : null).filter(Boolean))].sort().reverse();
      const currentYear = $('dashYear').value;
      $('dashYear').innerHTML = '<option value="">Semua Tahun</option>' + 
        years.map(y => `<option value="${y}">${y}</option>`).join('');
      if (years.includes(currentYear)) $('dashYear').value = currentYear;

      render();
      if (showMessage) toast('Data berhasil diperbarui.');
    })
    .catch(err => {
      $('emptyState').textContent = 'Gagal memuat data.';
      toast(err && err.message ? err.message : 'Gagal memuat data.', true);
    });
}

// 5. EVENT LISTENERS
$('nik').addEventListener('input', fillEmployeeName);$('nik').addEventListener('change', fillEmployeeName);

$('overtimeForm').addEventListener('submit', e => {
  e.preventDefault();
  fillEmployeeName();

  const payload = {
    date: $('date').value,
    nik: $('nik').value.trim(),
    name: $('name').value.trim(),
    description: $('description').value.trim(),
    hours: $('hours').value
  };

  if (!payload.name) {
    toast('NIK tidak ditemukan di Database Karyawan!', true);
    return;
  }

  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'Menyimpan...';

  runBackend('saveRecord', payload)
    .then(res => {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'Simpan Data';
      toast(res.message || 'Data lembur berhasil disimpan!');
      
      $('overtimeForm').reset();
      $('name').value = '';$('date').value = new Date().toISOString().split('T')[0];

      loadData();
    })
    .catch(err => {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = 'Simpan Data';
      toast(err && err.message ? err.message : 'Gagal menyimpan data.', true);
    });
});

window.deleteRecord = id => {
  if (!confirm('Yakin ingin menghapus baris data lembur ini?')) return;
  runBackend('deleteRecord', id)
    .then(res => {
      toast(res.message || 'Data dihapus.');
      loadData();
    })
    .catch(err => toast(err && err.message ? err.message : 'Gagal menghapus data.', true));
};

$('resetBtn').addEventListener('click', () => {$('overtimeForm').reset();
  $('name').value = '';$('date').value = new Date().toISOString().split('T')[0];
});

$('refreshBtn').addEventListener('click', () => loadData(true));
['dashYear', 'dashMonth', 'dashName'].forEach(id => $(id).addEventListener('change', render));

// Inisialisasi awal
$('date').value = new Date().toISOString().split('T')[0];
loadEmployees();
loadData();
</script>

</body>
</html>
